services:
  db:
    # postgres:16 无法从 Docker Hub 拉取（本机网络受限），暂用本地已有的 PG18 兼容镜像
    image: pgvector/pgvector:pg18
    container_name: interview-db
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview
    ports:
      - "5433:5432"   # 5432 已被本机其他项目占用
    volumes:
      - pgdata:/var/lib/postgresql   # pg18+ 镜像约定挂载到上一级目录
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
